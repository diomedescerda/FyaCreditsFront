<main class="auth-shell">
  <header class="auth-topbar">
    <img class="logo-mark" src="assets/brand/logo-fya.png" alt="Fya Social Capital" />
  </header>

  <section class="auth-card" aria-labelledby="forgot-title">
    <div class="eyebrow">Recuperación</div>
    <h1 id="forgot-title">Recupera tu contraseña</h1>
    <p class="muted">Te enviaremos un enlace para restablecerla.</p>

    @if (sent()) {
      <p class="alert-success" role="status">
        Si el correo existe, recibirás un enlace para restablecer tu contraseña.
      </p>
      <div class="auth-links">
        <a routerLink="/login">Volver a iniciar sesión</a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          Correo electrónico
          <input formControlName="email" type="email" autocomplete="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="field-error">Ingresa un correo válido.</span>
          }
        </label>

        @if (error()) {
          <p class="alert-error" role="alert">{{ error() }}</p>
        }

        <button class="button button-primary full-width" type="submit" [disabled]="loading()">
          {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/login">Volver a iniciar sesión</a>
      </div>
    }
  </section>
</main>
