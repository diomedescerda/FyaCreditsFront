<main class="auth-shell">
  <header class="auth-topbar">
    <img class="logo-mark" src="assets/brand/logo-fya.png" alt="Fya Social Capital" />
  </header>

  <section class="auth-card" aria-labelledby="reset-title">
    <div class="eyebrow">Recuperación</div>
    <h1 id="reset-title">Nueva contraseña</h1>
    <p class="muted">Para {{ email }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Nueva contraseña
        <input formControlName="password" type="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field-error">Mínimo 8 caracteres.</span>
        }
      </label>
      <label>
        Confirmar contraseña
        <input formControlName="confirmPassword" type="password" autocomplete="new-password" />
        @if (form.controls.confirmPassword.touched && form.errors?.['passwordsMismatch']) {
          <span class="field-error">Las contraseñas no coinciden.</span>
        }
      </label>

      @if (error()) {
        <p class="alert-error" role="alert">{{ error() }}</p>
      }
      @if (success()) {
        <p class="alert-success" role="status">{{ success() }}</p>
      }

      <button class="button button-primary full-width" type="submit" [disabled]="loading()">
        {{ loading() ? 'Guardando...' : 'Guardar contraseña' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </div>
  </section>
</main>
